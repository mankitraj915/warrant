[project]
name = "warrant"
version = "1.0.2"
description = "An information-flow-controlled action kernel for AI agents."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["kernel"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
