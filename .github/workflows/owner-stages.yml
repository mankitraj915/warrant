name: owner-run stages

# The owner-run measurement stages (scripts/phase3_run.py) on a GitHub runner, as an
# extra path next to local reproduction. Each run records the commit, the runner's
# specs and every step's log; the seeds are fixed in the scripts and recorded in each
# result row. Results are uploaded as an artifact.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "phase3-run stage"
        required: true
        type: choice
        options: [d, c, b, a, rates]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Record commit and runner specs
        run: |
          mkdir -p results/ci-${{ inputs.stage }}
          uv run --locked python - <<'EOF' > results/ci-${{ inputs.stage }}/runner.json
          import json, os, platform
          meminfo = dict(line.split(":", 1) for line in open("/proc/meminfo"))
          cpu = next((l.split(":", 1)[1].strip() for l in open("/proc/cpuinfo") if l.startswith("model name")), "")
          print(json.dumps({
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "stage": "${{ inputs.stage }}",
              "runner_os": os.environ.get("ImageOS", ""),
              "runner_image_version": os.environ.get("ImageVersion", ""),
              "cpus": os.cpu_count(),
              "cpu_model": cpu,
              "mem_total": meminfo["MemTotal"].strip(),
              "mem_available": meminfo["MemAvailable"].strip(),
              "python": platform.python_version(),
              "platform": platform.platform(),
          }, indent=1))
          EOF
          cat results/ci-${{ inputs.stage }}/runner.json
      - name: Run the stage
        run: >
          uv run --locked python scripts/tasks.py phase3-run
          --stage ${{ inputs.stage }} --out results/ci-${{ inputs.stage }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ inputs.stage }}-${{ github.sha }}
          path: results/ci-${{ inputs.stage }}
          retention-days: 90
